_ > nanoagent.plugin.v0001.ManifestConfig:
id: triage-blast-radius
name: Triage Blast Radius
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  generate_traffic:
    description: Write a seeded web access log with one planted incident to <destination>/traffic-<seed>-<requests>.csv
  count_distinct:
    description: Estimate how many distinct values one access log column takes over the rows in a status class and endpoint, with a HyperLogLog of 2^precision registers

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  generate-traffic:
    description: Generate a seeded access log
    runner: tool
    tools: [generate_traffic]
    reference: null
    instructions: Write the access log for the seed and request count into the destination folder and return its path, size and SHA-256.
  count-affected:
    description: Estimate the distinct values of an access log column
    runner: tool
    tools: [count_distinct]
    reference: null
    instructions: Hash the column of every row in the status class and endpoint into a HyperLogLog of 2^precision registers and return its estimate of the distinct values, with its standard error.
  largest-blast-radius:
    description: Find the endpoint whose 5xx errors reached the most users
    runner: agent
    tools: [generate_traffic, count_distinct]
    reference: null
    instructions: |-
      Generate the access log for the seed and request count with generate_traffic, destination traffic.
      For each of the 8 endpoints /api/search, /api/products, /api/cart, /api/login, /api/checkout, /api/profile, /api/reviews and /api/health, call count_distinct on that file with field user_id, status_class 5xx, that endpoint and precision 12.
      The endpoint with the largest estimate has the largest blast radius.
      Then call count_distinct on the same file with field user_id, status_class 5xx, endpoint "" (every endpoint) and precision 12 for the total.
      Submit the file as generate_traffic returned it, the endpoint, affected_estimate as that endpoint's estimate, and total_affected_estimate as the estimate of the call over every endpoint.
